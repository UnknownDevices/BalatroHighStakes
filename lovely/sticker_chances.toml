[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# Enforce sticker chances for Eternal
[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = '''if G.GAME.modifiers.enable_eternals_in_shop and eternal_perishable_poll > 0.7 and not SMODS.Stickers["eternal"].should_apply then'''
position = "at"
payload = '''if G.GAME.modifiers.enable_eternals_in_shop and eternal_perishable_poll > 1 - HighStakes.sticker_chance('eternal') and not SMODS.Stickers["eternal"].should_apply then'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = '''elseif G.GAME.modifiers.enable_perishables_in_shop and ((eternal_perishable_poll > 0.4) and (eternal_perishable_poll <= 0.7)) and not SMODS.Stickers["perishable"].should_apply then'''
position = "at"
payload = '''elseif G.GAME.modifiers.enable_perishables_in_shop and ((eternal_perishable_poll > 1 - HighStakes.sticker_chance('eternal') - HighStakes.sticker_chance('perishable')) and (eternal_perishable_poll <= 1 - HighStakes.sticker_chance('eternal'))) and not SMODS.Stickers["perishable"].should_apply then'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = '''if G.GAME.modifiers.enable_rentals_in_shop and pseudorandom((area == G.pack_cards and 'packssjr' or 'ssjr')..G.GAME.round_resets.ante) > 0.7 and not SMODS.Stickers["rental"].should_apply then'''
position = "at"
payload = '''if G.GAME.modifiers.enable_rentals_in_shop and pseudorandom((area == G.pack_cards and 'packssjr' or 'ssjr')..G.GAME.round_resets.ante) > 1 - HighStakes.sticker_chance('rental') and not SMODS.Stickers["rental"].should_apply then'''
match_indent = true
